name: Unity CI and staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref for a diagnostic build
        required: false
        default: main
        type: string
      build_windows:
        description: Also build Windows during diagnostics
        required: true
        default: true
        type: boolean

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Resolve CI identity
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.values.outputs.sha }}
      version: ${{ steps.values.outputs.version }}
      build_windows: ${{ steps.values.outputs.build_windows }}
      retention: ${{ steps.values.outputs.retention }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: values
        shell: bash
        env:
          REQUEST_WINDOWS: ${{ inputs.build_windows }}
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=8 HEAD)"
          base="$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset | head -n1)"
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::PlayerSettings.bundleVersion must be a semantic base version.'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${base}-staging.${GITHUB_RUN_NUMBER}+${short}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then echo 'build_windows=false' >> "$GITHUB_OUTPUT"; echo 'retention=7' >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then echo "build_windows=${REQUEST_WINDOWS:-true}" >> "$GITHUB_OUTPUT"; echo 'retention=14' >> "$GITHUB_OUTPUT";
          else echo 'build_windows=true' >> "$GITHUB_OUTPUT"; echo 'retention=21' >> "$GITHUB_OUTPUT"; fi

  validate_test_build:
    name: Validate, test, and build
    needs: identity
    uses: ./.github/workflows/_unity-build.yml
    with:
      source_ref: ${{ needs.identity.outputs.sha }}
      release_version: ${{ needs.identity.outputs.version }}
      release_type: staging
      build_windows: ${{ needs.identity.outputs.build_windows == 'true' }}
      retention_days: ${{ fromJSON(needs.identity.outputs.retention) }}
    secrets: inherit

  staging_deploy:
    name: Deploy both itch staging channels
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [identity, validate_test_build]
    runs-on: ubuntu-latest
    environment: itch-staging
    concurrency:
      group: itch-staging
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out deployment scripts at built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - name: Download exact successful build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unity-build-*
          path: payload
          merge-multiple: true
      - name: Revalidate deployment directories
        run: |
          bash scripts/ci/validate-output.sh StandaloneWindows64 payload/build/windows
          bash scripts/ci/validate-output.sh WebGL payload/build/webgl
      - name: Install stable Butler
        run: bash scripts/ci/install-butler.sh
      - name: Push Windows staging
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
          SOURCE_SHA: ${{ needs.identity.outputs.sha }}
        run: bash scripts/ci/deploy-itch.sh payload/build/windows windows-staging '${{ needs.identity.outputs.version }}'
      - name: Push WebGL staging
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
          SOURCE_SHA: ${{ needs.identity.outputs.sha }}
        run: bash scripts/ci/deploy-itch.sh payload/build/webgl html5-staging '${{ needs.identity.outputs.version }}'
